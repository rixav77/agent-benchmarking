# Base configuration — shared by ALL agents and evaluation
# Consistency: both agents use identical settings from this file

seed: 42

dataset:
  name: squad_v2
  split: validation
  num_questions: 1000
  answerable_ratio: 0.5  # 50% answerable, 50% unanswerable
  output_path: data/squad_v2_dev.jsonl

retriever:
  type: bm25  # bm25 | embedding
  top_k: 5
  embedding_model: BAAI/bge-large-en-v1.5
  cache_dir: data/embedding_cache

llm:
  base_url: "http://localhost:8000/v1"
  model: Qwen/Qwen3-14B
  temperature: 0
  max_tokens: 512

eval:
  semantic_threshold: 0.85
  unanswerable_keywords:
    - "unanswerable"
    - "cannot be answered"
    - "not enough information"
    - "no answer"
    - "cannot determine"
  f1_partial_threshold: 0.5

judge:
  temperature: 0
  max_tokens: 1024
  # Uses same LLM as agents (shared model)

pipeline:
  checkpoint_dir: evaluation/checkpoints
  predictions_dir: evaluation/predictions
  results_dir: evaluation/results
